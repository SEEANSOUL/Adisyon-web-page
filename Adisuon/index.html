<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin / Garson Girişi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./image/icon.png" type="image/png">
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('service-worker.js')
      .then(()=>console.log("SW yüklendi"))
      .catch(e=>console.error(e));
    }
  </script>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">🍽️ Sipariş Sistemi</h1>
    <form id="loginForm" class="card p-4 shadow-sm">
      <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Kullanıcı Adı" required>
      </div>
      <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="Şifre" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
