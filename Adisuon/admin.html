<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Masalar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" href="./image/icon.png" type="image/png">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">🛠️ Masalar Yönetimi</h2>

  <form id="masaForm" class="d-flex gap-2 mb-3">
    <input type="text" id="masaAdi" class="form-control" placeholder="Masa Adı" required>
    <button type="submit" class="btn btn-primary">Masa Ekle</button>
  </form>

  <div id="masaListesiAdmin" class="mb-4"></div>

  <!-- Ödeme Toplamları -->
  <div class="mb-3 p-3 border rounded bg-white">
    <h5>💰 Ödeme Toplamları</h5>
    <p>💵 Toplam Nakit: <span id="toplamNakit">0</span> ₺</p>
    <p>💳 Toplam Kart: <span id="toplamKart">0</span> ₺</p>
  </div>

  <!-- Ödeme Geçmişi -->
  <div class="p-3 border rounded bg-white">
    <h5>📜 Ödeme Geçmişi</h5>
    <ul id="odemeGecmisiList" class="list-group"></ul>
  </div>
</div>

<script>
const masaForm = document.getElementById("masaForm");
const masaListesiAdmin = document.getElementById("masaListesiAdmin");

// Masaları yükle
function masalariYukleAdmin() {
  const masalar = JSON.parse(localStorage.getItem("masalar") || "[]");
  masaListesiAdmin.innerHTML = "";
  masalar.forEach((m,i)=>{
    masaListesiAdmin.innerHTML += `
      <div class="d-flex justify-content-between align-items-center p-2 border mb-2 rounded">
        <span>${m.ad}</span>
        <button class="btn btn-danger btn-sm" onclick="masaSil(${i})">Sil</button>
      </div>
    `;
  });
}

// Masaları ekle
masaForm.addEventListener("submit", e=>{
  e.preventDefault();
  const ad = document.getElementById("masaAdi").value.trim();
  if(!ad) return;
  const masalar = JSON.parse(localStorage.getItem("masalar") || "[]");
  masalar.push({ad});
  localStorage.setItem("masalar", JSON.stringify(masalar));
  masaForm.reset();
  masalariYukleAdmin();
});

// Masa sil
window.masaSil = i => {
  const masalar = JSON.parse(localStorage.getItem("masalar") || "[]");
  masalar.splice(i,1);
  localStorage.setItem("masalar", JSON.stringify(masalar));
  masalariYukleAdmin();
}

// Ödeme toplamları ve geçmişini güncelle
function odemeToplamlariniGoster() {
  const odemeGecmisi = JSON.parse(localStorage.getItem("odemeGecmisi") || "[]");
  const toplamNakit = odemeGecmisi.filter(o => o.tur === "nakit").reduce((sum,o)=>sum+o.tutar,0);
  const toplamKart = odemeGecmisi.filter(o => o.tur === "kart").reduce((sum,o)=>sum+o.tutar,0);

  document.getElementById("toplamNakit").innerText = toplamNakit.toFixed(2);
  document.getElementById("toplamKart").innerText = toplamKart.toFixed(2);

  const list = document.getElementById("odemeGecmisiList");
  list.innerHTML = "";
  odemeGecmisi.forEach(o => {
    const li = document.createElement("li");
    li.className = "list-group-item";
    li.innerText = `${o.tarih} - ${o.masa} - ${o.tutar.toFixed(2)}₺ - ${o.tur.toUpperCase()}`;
    list.appendChild(li);
  });
}

// Sayfa yüklendiğinde
masalariYukleAdmin();
odemeToplamlariniGoster();
</script>

</body>
</html>
